# 物品名称
item:
  storage_bag:
    name: "便携式存储背包"
    lore: <arrow> 右键打开存储界面
  portable_enderchest:
    name: "便携式末影箱"
    lore: <arrow> 右键打开末影箱
  portable_trashcan:
    name: "便携式垃圾桶"
    lore: <arrow> 右键打开垃圾桶
  portable_workbench:
    name: "便携式工作台"
    lore: <arrow> 右键打开工作台
  single_item_storage_block:
    name: "量子存储(∞)"
    lore: |-
      <bold></bold>
      可以存储几乎无限多个物品
  storage_block:
    name: "一个普通的存储方块"
    lore: |-
      <bold></bold>
      连接到网络后可以存放大量物品
  memory_block:
    name: "存储器"
    lore: |-
      放入容量卡后接入网络
      右键打开卡槽界面
  memory_card_1k:
    name: "1K存储卡"
    lore: |-
      容量: 1024 个物品
      放入存储器使用
      取出不会丢失内容
  memory_card_4k:
    name: "4K存储卡"
    lore: |-
      容量: 4096 个物品
      放入存储器使用
      取出不会丢失内容
  memory_card_16k:
    name: "16K存储卡"
    lore: |-
      容量: 16384 个物品
      放入存储器使用
      取出不会丢失内容
  network_monitor:
    name: "网络监视器"
    lore: |-
      右键打开界面，选择方向
      监视该方向相邻的量子存储
      通过网格存取其内容
  network_bridge:
    name: "网桥"
    lore: |-
      用来连接相距较远的网络设备
      相邻放置即可扩展网络
  network_pusher:
    name: "网络推送器"
    lore: |-
      右键打开界面选择方向
      周期性地把网络内的物品
      沿该方向推送进相邻的机器或容器
      可放置样品物品过滤推送类型
  network_puller:
    name: "网络抓取器"
    lore: |-
      右键打开界面选择方向
      周期性地沿该方向从相邻的机器或容器
      抓取物品存入网络
  network_grid:
    name: "网格"
    lore: |-
      网格允许你查看网络中所有的物品
      你也可以直接放入或取出物品
      支持搜索
  knowledge_book:
    name: "学识之书"
    lore: |-
      右键以获得全解
  cheat_guide:
    name: "<dark_red>Rebar Guide(作弊版)"
    lore: |-
      右键打开 Rebar Guide(作弊版)
