# Java 25 toolchain：auto-detect 探测 JAVA_HOME 与常见目录；本机 JDK 在非标准目录，
# 因此本机路径写在 用户目录/.gradle/gradle.properties（不入库），CI 用 setup-java 的 JAVA_HOME 自动探测
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true