name: Build & Release

on:
  push:
    branches: [ "master", "main" ]

permissions:
  contents: write

concurrency:
  group: release-by-commit-message
  cancel-in-progress: false

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        id: setup_java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        # 把 setup-java 装好的 JDK 显式传给 Gradle（覆盖 gradle.properties 里写死的本机 Windows 路径），
        # 并跳过 foojay 自动下载，避免 CI 网络抖动
        run: >
          ./gradlew build -x test --no-daemon
          "-Porg.gradle.java.installations.paths=${{ steps.setup_java.outputs.path }}"
          "-Porg.gradle.java.installations.auto-download=false"

      - name: Prepare tag name from commit message
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          RAW_FIRST_LINE="$(printf "%s" "${{ github.event.head_commit.message }}" | head -n 1 | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"

          CLEAN="$(printf "%s" "$RAW_FIRST_LINE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g' \
            | sed -E 's/-+/-/g' \
            | sed -E 's/^-+|-+$//g' \
            | cut -c1-40)"

          if [ -z "$CLEAN" ]; then
            CLEAN="release"
          fi

          SHORT_SHA="$(printf "%s" "${GITHUB_SHA}" | cut -c1-7)"
          TAG="${CLEAN}-${SHORT_SHA}"

          echo "raw_first_line=$RAW_FIRST_LINE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skip creating."
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"

      - name: Collect artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          MAIN_JAR="$(ls -1 build/libs/*.jar | grep -vE '(-sources|-javadoc)\.jar$' | head -n 1 || true)"

          if [ -z "$MAIN_JAR" ]; then
            echo "No main jar found in build/libs/. Build may have failed or packaging differs."
            exit 1
          fi

          cp "$MAIN_JAR" dist/

          if ls build/libs/*-sources.jar >/dev/null 2>&1; then
            cp build/libs/*-sources.jar dist/
          fi

          echo "files=$(ls -1 dist | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.raw_first_line }}
          generate_release_notes: true
          files: |
            dist/*
